name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Typecheck (the Untrusted<T> trust boundary depends on it — ADR-0022 §3)
        run: bun x tsc --noEmit
      - name: Unit tests
        run: bun test
      - name: Shellcheck shell scripts
        run: git ls-files '*.sh' | xargs -r shellcheck
      - name: "Trust-boundary: the two unwrap sites (ADR-0022 §3)"
        run: bash scripts/check-unwrap-sites.sh
      - name: Validate the Claude Code plugin marketplace and plugin manifests
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/plugin.json --strict
