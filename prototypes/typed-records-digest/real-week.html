<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digest vs Graph</title>
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --accent: #4f46e5; --code-bg: #f5f5f4; --tag: #eef2ff; --tag-ink: #3730a3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09; --panel: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524;
    --accent: #818cf8; --code-bg: #141210; --tag: #1e1b4b; --tag-ink: #c7d2fe;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.stat b { font-variant-numeric: tabular-nums; }
nav { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2; }
nav .in { max-width: 1400px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
nav button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
nav input { margin-left: auto; min-width: 200px; flex: 1 1 200px; max-width: 320px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px; }
details.entry { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
details.entry > summary { cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
summary .t { font-weight: 600; }
summary .m { color: var(--muted); font-size: 12px; }
.tag { background: var(--tag); color: var(--tag-ink); border-radius: 4px; padding: 0 6px; font-size: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 12px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
.cols h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; max-height: 560px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.full pre { max-height: none; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>Prototype digest vs raw Graph, one real week</h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
</header>
<nav><div class="in">
  <button data-tab="meetings" aria-pressed="true">Meetings</button>
  <button data-tab="mail" aria-pressed="false">Mail</button>
  <button data-tab="output" aria-pressed="false">output.json</button>
  <button data-tab="raw" aria-pressed="false">graph-raw.json</button>
  <input id="q" type="search" placeholder="Filter entries…">
</div></nav>
<main id="main"></main>
<script>
const D = /*DATA*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const json = (v) => esc(JSON.stringify(v, null, 2));
const kb = (v) => (JSON.stringify(v).length / 1024).toFixed(1) + " KB";

const w = D.output.window;
$("#sub").textContent = `${w.from} → ${w.to} · ${D.output.timezone} · local only, contains real mail and calendar data`;
const cal = D.pairs.meetings, mail = D.pairs.mail;
$("#stats").innerHTML = [
  ["calendar records", D.raw.calendarView.length], ["meetings", cal.length],
  ["mail records", D.raw.inbox.length + D.raw.sent.length], ["mail threads", mail.length],
  ["meetings with rooms", cal.filter((p) => p.entry.rooms).length],
  ["output.json", kb(D.output)], ["raw Graph", kb(D.raw)],
  ["/me proxyAddresses returned", D.proxyAddressesReturned ? "yes" : "no"],
].map(([k, v]) => `<div class="stat">${esc(k)}: <b>${esc(v)}</b></div>`).join("");

function head(p) {
  const e = p.entry;
  if (e.type === "meeting") {
    const start = e.occurrences ? e.occurrences[0].start : e.start;
    return `<span class="t">${esc(e.title)}</span>
      <span class="tag">${e.recurring ? `series · ${e.occurrences.length}` : "one-off"}</span>
      ${e.rooms ? `<span class="tag">room: ${esc(e.rooms.join(", "))}</span>` : ""}
      <span class="m">${esc(start)} · ${(e.attendees?.length ?? 0) + (e.moreAttendees ?? 0)} attendees</span>`;
  }
  return `<span class="t">${esc(e.subject)}</span>
    <span class="tag">${e.messages} msg${e.lastFromYou ? " · you last" : ""}</span>
    <span class="m">${esc(e.lastAt)} · ${esc(e.lastFrom ?? "")}</span>`;
}

function entries(list) {
  const q = $("#q").value.toLowerCase();
  const shown = list.filter((p) => !q || JSON.stringify(p).toLowerCase().includes(q));
  return `<p class="note">${shown.length} of ${list.length}. Left: what rundown would emit (code-filled; no summaries yet). Right: the Graph objects it was built from.</p>` +
    shown.map((p) => `<details class="entry"><summary>${head(p)}</summary><div class="cols">
      <div><h3>Digest entry · ${kb(p.entry)}</h3><pre>${json(p.entry)}</pre></div>
      <div><h3>Raw Graph · ${p.raw.length} record${p.raw.length > 1 ? "s" : ""} · ${kb(p.raw)}</h3><pre>${json(p.raw)}</pre></div>
    </div></details>`).join("");
}

let tab = "meetings";
function render() {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  $("#q").style.visibility = tab === "meetings" || tab === "mail" ? "visible" : "hidden";
  $("#main").innerHTML =
    tab === "meetings" ? entries(cal) :
    tab === "mail" ? entries(mail) :
    `<div class="full"><pre>${json(tab === "output" ? D.output : D.raw)}</pre></div>`;
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
$("#q").addEventListener("input", render);
render();
</script>
</body>
</html>
